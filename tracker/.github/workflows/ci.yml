name: ci
on: [pull_request, push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 -m unittest discover -s tests -v
  review:                      # Chapter 9's review step (runs when the secret exists)
    runs-on: ubuntu-latest
    needs: test
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: claude review (fenced: read-only, cost-capped)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        run: |
          claude -p "Review this PR's diff for bugs and edge cases. Findings only."             --output-format json --allowedTools "Read,Grep,Glob"
